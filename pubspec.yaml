name: dreambank
description: A little escape from money worries. A local-first virtual bank.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: '>=3.47.8'

dependencies:
  characters: ^1.4.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  firebase_auth: ^6.0.0
  firebase_core: ^4.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  google_sign_in: ^7.2.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/account_card_background.jpg
    - assets/images/home_serenity.jpg
    - assets/images/dream_vault.jpg
    - assets/images/future_letter.jpg
